<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="head">
       
        <div class="left-section">
            <div class="bookmyshow">
                <p class="txt">BookMyShow</p>
            </div>
            <div>
                <button class="btn">
                    <p class="txt">Movies</p>
                </button>
                <button class="btn">
                    <p class="txt">Events</p>

                </button>
                <button class="btn">
                    <p class="txt">Sports</p>
                </button>
                <button class="btn">
                    <p class="txt">More</p>
                </button>
            </div>
        </div>
        <div class="right-section">
            <div>
        
                    <input type="text" placeholder="Search movies, series, plays..." class="search">
          
            </div>
            <div>
                <button class="search-btn">
                    <p class="txt">Search</p>
                </button>
            </div>
            
        </div>
        
        

        
        
    </header>
   <!-- hero section -->

   <div class="hero">
    <h2 class="hero-txt">Experience the best movie and events</h2>
    <button class="hero-btn">Book Now</button>
   </div>

   <div class="content">
    <div class="txt-div">
        <h2 class="content-txt">Popular Movies</h2>
    </div>
    

    <div class="movies">
        <div class="card">
            <button class="card-btn">
                <div class="card-img">
                    <img src="./assets/batwara.png" alt="b">

                </div>
                <div class="card-txt">
                    <h2>Batwara 1947</h2>
                    <p class="des">Action/Drama/Period</p>
                </div>

            </button>
        </div>


        <div class="card">
            <button class="card-btn">
                <div class="card-img">
                    <img src="./assets/Alpha.png" alt="b">


                </div>
                <div class="card-txt">
                    <h2>Alpha</h2>
                    <p class="des">Action/Drama/Period</p>
                </div>

            </button>
        </div>



        <div class="card">
            <button class="card-btn">
                <div class="card-img">
                    <img src="./assets/awarapan2.png" alt="b">

                </div>
                <div class="card-txt">
                    <h2>Awarapan 2</h2>
                    <p class="des">Action/Drama/Period</p>
                </div>

            </button>
        </div>


        <div class="card">
            <button class="card-btn">
                <div class="card-img">
                    <img src="./assets/biplobi.png" alt="">

                </div>
                <div class="card-txt">
                    <h2>Biplabi</h2>
                    <p class="des">Action/Drama/Period</p>
                </div>

            </button>
        </div>


        <div class="card">
            <button class="card-btn">
                <div class="card-img">
                    <img src="./assets/spidderman.png" alt="b">

                </div>
                <div class="card-txt">
                    <h2>Spiderman</h2>
                    <p class="des">Action/Drama/Period</p>
                </div>

            </button>
        </div>

        <div class="card">
            <button class="card-btn">
                <div class="card-img">
                    <img src="./assets/the-end-of-oak.png" alt="">
                    
                </div>
                <div class="card-txt">
                    <h2>The End of Oak</h2>
                    <p class="des">Action/Drama/Period</p>
                </div>

            </button>
        </div>
    </div>
    
   </div>
    
</body>

<footer class="foter">
    <img class="foter-img" src="./assets/foter.png" alt="">
</footer>
</html>
