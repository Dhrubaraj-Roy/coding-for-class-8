<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <!-- Title -->
        <h1 class="title">Tic Tac Toe</h1>

        <!-- Status Display -->
        <div class="status" id="status">Player O's Turn</div>

        <!-- Game Board -->
        <div class="board" id="board">
            <div class="cell" id="0"></div>
            <div class="cell" id="1"></div>
            <div class="cell" id="2"></div>
            <div class="cell" id="3"></div>
            <div class="cell" id="4"></div>
            <div class="cell" id="5"></div>
            <div class="cell" id="6"></div>
            <div class="cell" id="7"></div>
            <div class="cell" id="8"></div>
        </div>

        <!-- Restart Button -->
        <button class="restart-btn" id="restartBtn">Restart Game</button>

        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="score-card score-x">
                <span class="score-label">Player X</span>
                <span class="score-value" id="scoreX">0</span>
            </div>
            <div class="score-card score-draw">
                <span class="score-label">Draws</span>
                <span class="score-value" id="scoreDraw">0</span>
            </div>
            <div class="score-card score-o">
                <span class="score-label">Player O</span>
                <span class="score-value" id="scoreO">0</span>
            </div>
        </div>
    </div>

    <!-- Winner Overlay -->
    <div class="overlay" id="overlay">
        <div class="winner-modal">
            <h2 class="winner-text" id="winnerText">🎉 Player X Wins!</h2>
            <button class="play-again-btn" id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
